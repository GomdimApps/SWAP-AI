services:
  db:
    image: postgres:16.8-alpine3.20
    container_name: swap-ai-database
    restart: always
    shm_size: 1024mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      swap-ai-network:
        ipv4_address: 192.168.10.2
  swap-ai-server:
    build: .
    container_name: swap-ai-server-01
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    networks:
      swap-ai-network:
        ipv4_address: 192.168.10.3
    ports:
      - "8080:8080"

networks:
  swap-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/29